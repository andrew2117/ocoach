<!--
  Supabase Dashboard -> Authentication -> Emails -> "Magic link" template.
  Paste this as the body. Suggested subject: "Your OCoach sign-in link".

  The link goes to the app's /auth/callback route (the `emailRedirectTo` passed
  by frontend/app/login/page.tsx) with a token hash, which the route verifies
  server-side with verifyOtp(). Unlike the default {{ .ConfirmationURL }}, this
  works when the email is opened in a different browser or device.

  {{ .RedirectTo }} must be listed under Authentication -> URL Configuration ->
  Redirect URLs, otherwise Supabase falls back to the Site URL.
-->
<h2>Sign in to OCoach</h2>

<p>Use this link to sign in. It expires shortly and can only be used once.</p>
<p>
  <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email">Sign in</a>
</p>
<p>If you didn't request this, you can safely ignore this email.</p>
